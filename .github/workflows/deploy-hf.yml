name: Deploy to Hugging Face Spaces

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        lfs: true
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install huggingface_hub requests
    
    - name: Create Hugging Face Space
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      run: |
        python -c "
        import os
        from huggingface_hub import HfApi, create_repo
        
        # Initialize HF API
        api = HfApi()
        
        # Repository details
        repo_id = 'shravanramakunja/ZenAI'
        
        try:
            # Create repository if it doesn't exist
            create_repo(
                repo_id=repo_id,
                token=os.environ['HF_TOKEN'],
                repo_type='space',
                space_sdk='streamlit',
                exist_ok=True
            )
            print(f'Repository {repo_id} created/verified successfully')
        except Exception as e:
            print(f'Repository creation: {e}')
        
        # Upload all files using upload_folder (simpler approach)
        try:
            api.upload_folder(
                folder_path='.',
                repo_id=repo_id,
                repo_type='space',
                token=os.environ['HF_TOKEN'],
                ignore_patterns=['.git', '.github', '.env', '*.log', '__pycache__', '.gitignore']
            )
            print('All files uploaded successfully')
            
        except Exception as e:
            print(f'Upload error: {e}')
        
        # Set environment variables for the space
        try:
            api.add_space_secret(
                repo_id=repo_id,
                key='GOOGLE_API_KEY',
                value=os.environ['GOOGLE_API_KEY'],
                token=os.environ['HF_TOKEN']
            )
            print('Environment variables configured successfully')
        except Exception as e:
            print(f'Environment variable setup: {e}')
            print('Please manually set GOOGLE_API_KEY in Space settings')
        "
    
    - name: Wait for Space to build
      run: |
        echo "🚀 Deployment initiated!"
        echo "📱 Your ZenAI Medical Chatbot will be available at:"
        echo "🌐 https://huggingface.co/spaces/shravanramakunja/ZenAI"
        echo "⏳ Please wait a few minutes for the Space to build and start..."
