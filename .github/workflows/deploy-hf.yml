name: Deploy to Hugging Face Spaces

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        lfs: true
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install huggingface_hub
    
    - name: Create Hugging Face Space
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      run: |
        python -c "
        import os
        from huggingface_hub import HfApi, create_repo
        
        # Initialize HF API
        api = HfApi()
        
        # Repository details
        repo_id = 'shravanramakunja/ZenAI'
        
        try:
            # Create repository if it doesn't exist
            create_repo(
                repo_id=repo_id,
                token=os.environ['HF_TOKEN'],
                repo_type='space',
                space_sdk='streamlit',
                exist_ok=True
            )
            print(f'Repository {repo_id} created/verified successfully')
        except Exception as e:
            print(f'Repository creation: {e}')
        
        # Upload files
        try:
            # Upload main application files
            api.upload_file(
                path_or_fileobj='app.py',
                path_in_repo='app.py',
                repo_id=repo_id,
                repo_type='space',
                token=os.environ['HF_TOKEN']
            )
            
            api.upload_file(
                path_or_fileobj='requirements.txt',
                path_in_repo='requirements.txt',
                repo_id=repo_id,
                repo_type='space',
                token=os.environ['HF_TOKEN']
            )
            
            api.upload_file(
                path_or_fileobj='README.md',
                path_in_repo='README.md',
                repo_id=repo_id,
                repo_type='space',
                token=os.environ['HF_TOKEN']
            )
            
            # Upload src directory
            api.upload_folder(
                folder_path='src',
                repo_id=repo_id,
                repo_type='space',
                token=os.environ['HF_TOKEN']
            )
            
            # Upload data directory (without .env sensitive files)
            api.upload_folder(
                folder_path='data',
                repo_id=repo_id,
                repo_type='space',
                token=os.environ['HF_TOKEN']
            )
            
            print('Files uploaded successfully')
            
        except Exception as e:
            print(f'Upload error: {e}')
        "
    
    - name: Create Hugging Face Space configuration
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      run: |
        # Create space configuration
        cat > config.yaml << EOF
        title: ZenAI 
        emoji: 
        colorFrom: blue
        colorTo: green
        sdk: streamlit
        sdk_version: 1.47.1
        app_file: app.py
        pinned: false
        license: mit
        variables:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        EOF
        
        # Upload configuration
        python -c "
        import os
        from huggingface_hub import HfApi
        
        api = HfApi()
        repo_id = 'shravanramakunja/ZenAI'
        
        api.upload_file(
            path_or_fileobj='config.yaml',
            path_in_repo='README.md',
            repo_id=repo_id,
            repo_type='space',
            token=os.environ['HF_TOKEN']
        )
        print('Configuration uploaded')
        "
    
    - name: Wait for Space to build
      run: |
        echo " Deployment initiated!"
        echo " Your ZenAI Medical Chatbot will be available at:"
        echo " https://huggingface.co/spaces/shravanramakunja/ZenAI"
        echo " Please wait a few minutes for the Space to build and start..."
